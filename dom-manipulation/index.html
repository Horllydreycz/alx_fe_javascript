<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Quote Generator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Dynamic Quote Generator</h1>
  </div>
  <div id="quoteDisplay"></div>
  
  <div>
    <input id="newQuoteText" type="text" placeholder="Enter a new quote" />
    <input
    id="newQuoteCategory"
    type="text"
    placeholder="Enter quote category"
    />
    <input id="newQuoteAuthor" type="text" placeholder="Author's name" />
    <input
    type="file"
    id="importFile"
    accept=".json"
    onchange="importFromJsonFile(event)"
  </div>
      <div="button-group">
        <button id="newQuote">Show New Quote</button>
        <button onclick="addQuote()">Add Quote</button>
        <button id="exportBtn">Export Quotes</button>
        <button id="importBtn">Import Quotes</button>
        <input type="file" id="importFile" accept=".json" />
      </div>
      <select id="categoryFilter" onchange="filterQuotes()">
    <option value="all">All Categories</option>
    <!-- Dynamically populated categories -->
  </select>
    <script src="script.js"></script>
  </body>
</html>
